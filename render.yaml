services:
  - type: web
    name: frontend
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run preview
    rootDir: .
    
  - type: web
    name: backend
    runtime: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        scope: runtime
        value: production
      - key: PORT
        value: "8000"
