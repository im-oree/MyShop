services:
  - type: web
    name: frontend
    runtime: node
    buildCommand: npm install
    startCommand: npm run preview
    rootDir: .
    envVars:
      - key: VITE_API_BASE_URL
        scope: build
        value: https://${RENDER_EXTERNAL_HOSTNAME}/backend
    
  - type: web
    name: backend
    runtime: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        scope: runtime
        value: production
      - key: PORT
        value: "8000"
