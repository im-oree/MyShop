services:
  - type: web
    name: frontend
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run preview
    rootDir: .
    envVars:
      - key: VITE_API_BASE_URL
        scope: build
        value: "" # set to backend host (e.g. https://myshop-backend-xxxxx.onrender.com)
      - key: VITE_API_BASE_URL
        scope: runtime
        value: ""
    
  - type: web
    name: backend
    runtime: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        scope: runtime
        value: production
      - key: PORT
        value: "8000"
      - key: CORS_ORIGIN
        scope: runtime
        value: ""
      - key: FIREBASE_PROJECT_ID
        scope: runtime
        value: ""
      - key: FIREBASE_CLIENT_EMAIL
        scope: runtime
        value: ""
      - key: FIREBASE_PRIVATE_KEY
        scope: runtime
        value: ""
      - key: JWT_SECRET
        scope: runtime
        value: ""
      - key: PAYSTACK_ENV
        scope: runtime
        value: "test"
